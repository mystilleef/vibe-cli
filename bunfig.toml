[test]
root = "tests"
preload = ["./tests/helpers/mockBackupError.ts"]
coverage = true
coverageSkipTestFiles = true
coverageReporter = ["text", "lcov"]
coverageDir = "./coverage"
coveragePathIgnorePatterns = [
  "tests/**",
  "node_modules/**",
  "**/*.test.ts",
  "**/*.spec.ts",
  "**/*.e2e.ts",
  "*.config.js",
  "*.config.ts",
  "webpack.config.*",
  "vite.config.*",
  "dist/**",
  "build/**",
  ".next/**",
  "generated/**",
  "**/*.generated.ts",
  "vendor/**",
  "third-party/**",
]
